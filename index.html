      </div>

      <!-- Mobile brand & Right controls -->
      <div class="flex items-center justify-between sm:justify-end w-full sm:w-auto gap-3">
        <a href="index.html" class="sm:hidden font-display font-bold text-neutral-900 text-lg" aria-label="Rosas Behoundja — home">Rosas<span class="text-neutral-900">.</span></a>
        
        <div class="flex items-center gap-3">

          <button id="menuToggleBtn" class="sm:hidden text-neutral-700 hover:text-[#1a1de3] p-1 text-lg cursor-pointer" aria-label="Toggle menu" onclick="toggleMobileMenu()">
            <i class="fas fa-bars" id="menuIcon"></i>

      </div>

    <div class="flex flex-col gap-2">
      <h1 class="font-display text-2xl sm:text-3xl font-bold tracking-tight text-neutral-900">Rosas Behoundja<span class="text-neutral-900">.</span></h1>
      <div class="inline-flex items-center gap-2 px-3 py-1 text-xs font-mono font-medium text-red-600 bg-red-50 border border-red-200 rounded-full w-fit">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
        </span>
        <span class="fr-text">actuellement à la recherche d'un stage</span>
        <span class="en-text">currently looking for an internship</span>
      </div>
      <div class="profile-socials flex items-center gap-4 flex-wrap mt-2 text-lg">
        <a href="mailto:perrierosas@gmail.com" title="Email" class="icon-email hover:opacity-80 transition-opacity"><i class="fas fa-envelope"></i></a>
        <a href="https://linkedin.com/in/rosasbehoundja" target="_blank" title="LinkedIn" class="icon-linkedin hover:opacity-80 transition-opacity"><i class="fab fa-linkedin"></i></a>
        <a href="https://github.com/rosasbehoundja" target="_blank" title="GitHub" class="icon-github hover:opacity-80 transition-opacity"><i class="fab fa-github"></i></a>
        <a href="assets/cv/Rosas_Behoundja_Resume.pdf" target="_blank" title="CV / Resume" class="icon-cv hover:opacity-80 transition-opacity flex items-center gap-1">
          <i class="fas fa-file-pdf"></i>
          <span class="text-sm font-sans font-medium">CV</span>
        </a>
      </div>
    </div>
    <img class="w-28 h-28 sm:w-36 sm:h-36 rounded-full object-cover flex-shrink-0" src="assets/media/me/dli2.jpeg" alt="Rosas Behoundja">

  <section class="mb-10">
    <h2 class="font-display text-lg font-bold text-[#1a1de3] lowercase mb-3 tracking-wide before:content-['#_'] before:opacity-50">
      <span class="fr-text">à propos</span>
      <span class="en-text">about</span>
    </h2>

    <div class="fr-text markdown-body" id="about-fr"></div>
    <div class="en-text markdown-body" id="about-en"></div>
  </section>

  <section id="news" class="mb-10">
    <h2 class="font-display text-lg font-bold text-[#1a1de3] lowercase mb-3 tracking-wide before:content-['#_'] before:opacity-50">
      <span class="fr-text">récemment</span>
      <span class="en-text">news</span>
    </h2>

    <div class="flex flex-col gap-3 mb-5" id="news-list"></div>

    <div class="flex items-center gap-4 text-xs font-mono mt-4" id="newsPagination" style="display: none;">
      <button id="prevNews" class="px-3 py-1 border border-neutral-200 rounded text-neutral-800 disabled:opacity-30 disabled:cursor-not-allowed hover:enabled:bg-neutral-100 hover:enabled:border-[#1a1de3] transition-all cursor-pointer" disabled><i class="fas fa-chevron-left"></i></button>
      <span id="newsPageIndicator">1 / 1</span>
      <button id="nextNews" class="px-3 py-1 border border-neutral-200 rounded text-neutral-800 disabled:opacity-30 disabled:cursor-not-allowed hover:enabled:bg-neutral-100 hover:enabled:border-[#1a1de3] transition-all cursor-pointer"><i class="fas fa-chevron-right"></i></button>

    <div class="fr-text markdown-body" id="beyond-fr"></div>
    <div class="en-text markdown-body" id="beyond-en"></div>

  <footer class="mt-16 pt-4 text-xs text-neutral-400 border-t border-dashed border-neutral-200">
